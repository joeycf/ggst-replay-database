name: Daily data refresh

on:
  schedule:
    # 08:47 UTC daily (odd minute to dodge cron rush; the SIXTH stagger slot on
    # the platform, after 2XKO's 06:17, Tekken's 06:47, SF6's 07:17, Tōkon's
    # 07:47 and CotW's 08:17, so the six refreshes never contend).
    #
    # This slot was reserved for us: CotW's own workflow says "NOTE FOR WHOEVER
    # ADDS GAME SIX … the next free slot is 08:47". Taking it widens the
    # platform's no-push window from 06:00–08:30 to 06:00–09:00.
    #
    # NOTE FOR WHOEVER ADDS GAME SEVEN: the pattern is +30 minutes alternating
    # :17/:47, so the next free slot is 09:17 and the window becomes 06:00–09:30.
    - cron: '47 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # matches engines.node (the platform's Node policy — STACK.md §1)
          node-version: 24
          cache: npm

      - run: npm ci

      # fetch + parse + emit. The roster, the character art and the OG card are
      # NOT part of the daily run: scripts/characters.ts, scripts/art.ts and
      # scripts/og.ts only run when the roster or the brand changes, and
      # scripts/patch-check.ts is manual by design (a patch table is a human
      # decision, and a daily job reaching out to the vendor would fail on their
      # outage rather than ours).
      #
      # Quota, measured 2026-09-07: the steady-state daily read is ~9–20 units
      # of the 10,000/day allowance — eight uploads-playlist pages plus one
      # videos.list hydration. The one-time backfill was 828. It is search.list
      # that is expensive (100 units per 50 results); nothing here uses it.
      - name: Fetch channel uploads
        run: npm run data:fetch
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      # THE INDEX PULL, AND IT IS ALLOWED TO FAIL.
      #
      # This is the second half of "the cron never depends on Replay Theater
      # succeeding", and it is deliberately a step of its own rather than a link
      # in an && chain — a chain would take the whole refresh down with it,
      # which is exactly the dependency the split exists to avoid.
      #
      # continue-on-error marks the run yellow and moves on. scripts/parse.ts
      # then finds no dump, carries the committed records against the pin in
      # data/source-pins.json, and the rest of the day proceeds normally. A bad
      # morning upstream costs that morning's new entries; nothing already
      # committed is at risk, because this intake is add-only.
      #
      # LAST OF THE FETCHES, so a failure here cannot cost the channel dumps
      # already in hand. It reads a bounded cursor (two clean pages, ten at
      # most) rather than the whole catalogue — which here is 439 pages, the
      # largest on the platform by 6×, so the bound is 2.3% of it and will
      # genuinely bite on an upstream reorder. That is what it is for; the
      # reconcile is `npm run data:theater -- --full` and nothing is lost under
      # add-only, only late.
      #
      # YT_API_KEY is repeated on purpose: `env:` is per step, and
      # requireApiKey() runs at module load, so without it this exits 1 before
      # it has read anything.
      - name: Fetch the tournament index (Replay Theater)
        continue-on-error: true
        run: npm run data:theater
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}

      - name: Parse
        run: npm run data:parse

      - name: Emit
        run: npm run data:emit

      - name: Commit if changed
        run: |
          git config user.name "ggst-data-refresh[bot]"
          git config user.email "data-refresh@users.noreply.github.com"
          # THE FILE LIST IS BY NAME, NEVER `git add data/`. A blanket add would
          # stage whatever else happens to be in data/ — a hand-edited
          # overrides.json mid-review, a scratch file — and commit it as part of
          # an unattended refresh. Every file below is pipeline-owned:
          #
          #   videos.json          the parse substrate
          #   replays.json         the emitted public contract (also copied to
          #                        public/data at build time)
          #   stats.json players.json characters.json
          #                        the provided registries
          #   patchGroups.json patchBoundaries.json seasonBoundaries.json
          #                        derived from scripts/seasons.ts; a daily run
          #                        can legitimately change them the day a patch
          #                        is added
          #   summary.json         the apex selector's card payload
          #   review-queue.json    parse-regenerated derived state, content-only
          #   player-redirects.json hand-authored but validated here
          #   source-pins.json     the index intake's carry pin. Most runs
          #                        rebuild and rewrite it, so staging it is
          #                        required — an unstaged file that DOES change
          #                        is a change discarded in silence.
          #   theater-cursor.json  where the index pull remembers how far it
          #                        read. raw/ is gitignored and CI starts from a
          #                        fresh checkout, so uncommitted the cursor
          #                        resets to 0 every morning and every run
          #                        becomes a bounded sweep that never goes quiet.
          #   report.md            the human-readable run report
          git add \
            data/videos.json data/replays.json data/stats.json data/players.json \
            data/characters.json data/patchGroups.json data/patchBoundaries.json \
            data/seasonBoundaries.json data/summary.json data/review-queue.json \
            data/player-redirects.json data/source-pins.json data/theater-cursor.json \
            data/report.md
          # report.md's "_Generated <timestamp>_" line changes every run; a diff
          # that is ONLY that line is not a data change — drop it so a no-change
          # day produces no commit (and no deploy). report.md still ships
          # whenever anything real changes alongside it — including the day an
          # "## ⚠ ACTION REQUIRED" block first appears, which is real content.
          REAL=$(git diff --cached -- data/report.md | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | { grep -vc '^[+-]_Generated ' || true; })
          if [ "$REAL" -eq 0 ]; then
            git restore --staged --worktree data/report.md
          fi
          # AND THE SAME FOR THE CURSOR. The catalogue takes new entries most
          # days whether or not any of OUR data changed — four total_count
          # readings over ~43 hours (2026-09-07 → 09-09) gave a baseline of
          # ~10–12 rows/day AND one bulk-submission day of +120, so the
          # highest-seen id rises on essentially every run and sometimes by a
          # lot. (The +120 day is also why the 10-page cursor bound exists.)
          # Left staged that would retire the no-change-no-commit rule outright
          # and put a deploy on the calendar every day forever. Dropped when it
          # is the only thing left, the cursor simply does not advance on a quiet
          # day and the next run re-reads those pages; the cost is a page or two,
          # bounded at ten, and nothing is lost because the intake is add-only.
          #
          # Written as an emptiness test on the remaining staged NAMES rather
          # than `git diff --quiet -- <paths>`: with the cursor filtered out that
          # path list can be EMPTY, and an empty pathspec means "everything",
          # which would silently invert the check.
          OTHERS=$(git diff --cached --name-only | grep -v '^data/theater-cursor.json$' || true)
          if [ -z "$OTHERS" ]; then
            git restore --staged --worktree data/theater-cursor.json
          fi
          if git diff --cached --quiet; then
            echo "No data changes — skipping commit."
            exit 0
          fi
          N=$(node -p "require('./data/replays.json').length")
          git commit -m "data: refresh $(date -u +%F) — ${N} replays"
          git push

      # Deploy is Vercel's git integration off the push above — there is no
      # deploy step here to run "after", so this polls until production serves
      # the digest we just committed. A build still in flight is a WARNING; a
      # served count outside the collapse guard's own band is a FAILURE. The
      # guard in parse.ts protects the repository; this protects what visitors
      # get.
      #
      # Deliberately BEFORE "Flag due expiries": that step is designed to go
      # red, and a red step stops the ones after it.
      - name: Post-deploy smoke check
        run: npm run verify:deployed

      - name: Flag due expiries
        # Deliberately failing (scripts/expiries.ts).
        # The data has already been committed and pushed by the step above, so a
        # red run never costs a refresh — it only makes the pending work
        # impossible to miss.
        #
        # THE UNRELEASED-CHARACTER ARM SHIPS EMPTY, and that is a measurement not
        # an oversight: Season 5's two remaining slots are literally "???" on
        # ArcSys's store page (DLC #20 Winter 2026, DLC #21 Spring 2027) with no
        # name, no portrait and no page, so there is nothing to gate on yet. The
        # season and patch-table arms are live from day one.
        # Clear it by doing the work, NOT by deleting this step.
        run: npx tsx scripts/expiries.ts --check

      - name: Flag stale redirects
        # `if: always()` because the step above is DESIGNED to go red, and a red
        # step stops the ones after it. These two gates are independent, and both
        # have to be able to report on the same run.
        #
        # WHAT THIS GUARDS HERE IS NOT WHAT IT GUARDS IN THE SIBLINGS, and the
        # difference is worth stating because copying their reasoning would be
        # wrong. Tekken and Tokon DERIVE vercel.json redirects from the ledger and
        # their parse.ts grows that ledger automatically, so their risk is a
        # derived file silently falling behind — Tokon had accumulated seventeen
        # missing routes by 2026-09-10. This repo has no vercel.json at all: the
        # engine reads data/player-redirects.json directly, and that file is
        # HAND-AUTHORED (parse.ts never writes it), because merging two player ids
        # is a claim that two handles are the same PERSON and no string distance
        # can establish that.
        #
        # So the ledger here does not drift. THE CORPUS UNDER IT DOES. `--check`
        # asserts every redirect target still exists and no chain loops, and the
        # cron rewrites players.json nightly — so a target can stop existing
        # without anyone touching this file, turning a redirect into a 404 wearing
        # a 301. That check already lived in `npm run typecheck`, which the cron
        # does not run, so nothing was watching it between human runs.
        #
        # Clear it by fixing the ledger, NOT by deleting this step.
        if: always()
        run: npx tsx scripts/redirects.ts --check
