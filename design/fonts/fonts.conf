<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig for the image generators (scripts/og.ts).

  The @fontsource packages ship only .woff/.woff2, which fontconfig does not
  read, so the display and UI faces are invisible to sharp/librsvg unless they
  are provided as real font files. `fc-match "Black Ops One"` on a clean machine
  answers "DejaVuSans.ttf" — a plausible fallback, silently.

  These two OFL-licensed TTFs are committed beside this file for exactly that
  reason. scripts/og.ts points FONTCONFIG_FILE here and then PROVES each family
  drew before writing anything (checklist 5d).

  5d NEEDS TWO PROBE STRINGS ON THIS GAME, not one. The check must measure each
  SUBSET through a string only that subset can draw:
    latin      JACK-O' ZATO=1 ASUKA R# A.B.A I-NO BEDMAN? 0123456789
    latin-ext  a codepoint >= U+0100 (e.g. ō U+014D)
  Every roster punctuation case — ' - # . ? / and the digits — lives inside
  U+0000-00FF, i.e. the LATIN subset, so a latin-only probe would report green
  while the latin-ext face had never loaded. Verified against the real cmap
  2026-09-07: Black Ops One maps 693 codepoints and carries all of U+0027,
  U+2019, U+002D, U+0023, U+002E, U+003F, U+002F and the digits.
-->
<fontconfig>
  <dir prefix="default">.</dir>
  <cachedir prefix="default">.fc-cache</cachedir>
</fontconfig>
